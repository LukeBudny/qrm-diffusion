[project]
root = "../.."

[memory]
max_vram_gib = 28.0
device = 0
enforce = true
expandable_segments = true

[model]
backend = "sd35_native"
name = "sd35-medium"
checkpoint = "models/sd3.5_medium.safetensors"
model_folder = "models"
shift = 3.0
text_encoder_device = "cpu"
load_tokenizers = true
# Reward/vision encoders are unnecessary during baseline or QRM image generation.
eval_model = "none"

[generation]
prompt = "A cinematic photograph of a mountain lake at sunrise."
output_dir = "outputs"
width = 1024
height = 1024
steps = 30
guidance_scale = 5.0
seed = 42

[generation.extra]
sampler = "dpmpp_2m"

[qrm]
enabled = false
checkpoint = "models/qrm_checkpoint/qrm_epoch25.pth"
qrm_type = "QRMModulatorLatentV6"
start_step = 25
end_step = 47

[controller]
enabled = false
config = "configs/agents/sd35-qrm-timestep.toml"
# Set this to a trained controller checkpoint and enable the controller to use it.
checkpoint = ""
